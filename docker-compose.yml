services:
  nginx:
    image: nginx:1.31.10-trixie
    container_name: app_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/fastcgi.conf:/etc/nginx/fastcgi.conf
    depends_on:
      - php
    networks:
      - seme_webstack_network

  php:
    # image: drosanda/seme_webstack_php:7.4
    # build:
    #   context: ./7.4/
    #   dockerfile: Dockerfile

    # image: drosanda/seme_webstack_php:8.2
    # build:
    #   context: ./8.2/
    #   dockerfile: Dockerfile

    # image: drosanda/seme_webstack_php:8.3
    # build:
    #   context: ./8.3/
    #   dockerfile: Dockerfile

    # image: drosanda/seme_webstack_php:8.4
    # build:
    #   context: ./8.4/
    #   dockerfile: Dockerfile

    image: drosanda/seme_webstack_php:8.5
    build:
      context: ./8.5/
      dockerfile: Dockerfile

    container_name: app_php
    volumes:
      - ./:/var/www/html
    networks:
      - seme_webstack_network

networks:
  seme_webstack_network:
    external: true
